[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: 部署後第一個跑：健康檢查與主要流程，失敗就不用跑後面
    validation: 輸入驗證
    boundary: 邊界值
    precision: 金額精度
    negative: 負數、錯誤輸入
    business: 商業規則
    limit: 限額
    idempotency: 重送、重複扣款
    concurrency: 同時發生的請求
    refund: 退款
    transfer: 轉帳
    contract: 回應格式（jsonschema）
    db: 直接查資料庫驗證
    case_id(id): 測試案例編號（--target_case_ids 用）
